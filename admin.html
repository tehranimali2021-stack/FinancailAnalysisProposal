<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ادمین پروپوزال</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="p-6">

  <!-- صفحه ورود -->
  <div id="loginBox" class="max-w-sm mx-auto section-card mt-20">
    <h2 class="text-xl font-bold mb-4" style="color:var(--navy)">ورود مدیریت</h2>
    <input id="user" placeholder="نام کاربری" class="border w-full p-2 rounded mb-2">
    <input id="pass" type="password" placeholder="رمز عبور" class="border w-full p-2 rounded mb-2">
    <button onclick="login()" class="bg-blue-600 text-white w-full p-2 rounded">ورود</button>
    <p id="loginErr" class="text-red-600 text-sm mt-2"></p>
  </div>

  <!-- پنل مدیریت -->
  <div id="panel" class="hidden max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold" style="color:var(--navy)">مدیریت محتوای پروپوزال</h1>
      <a href="index.html" class="border px-4 py-2 rounded">مشاهده صفحه اصلی</a>
    </div>

    <!-- تنظیمات اقتصادی -->
    <section class="section-card">
      <h2 class="font-bold mb-3">تنظیمات اقتصادی</h2>
      <label class="block mb-2">نرخ تورم سالانه (مثلاً 0.40 برای ۴۰٪):
        <input id="inflation" type="number" step="0.01" class="border p-2 rounded w-full">
      </label>
      <label class="flex items-center gap-2">
        <input id="applyInf" type="checkbox"> اعمال خودکار تعدیل تورمی روی مبالغ
      </label>
    </section>

    <!-- ویرایش مبالغ سرمایه‌گذاری -->
    <section class="section-card">
      <h2 class="font-bold mb-3">مبالغ سرمایه‌گذاری (پایه، به تومان)</h2>
      <div id="investEditor"></div>
    </section>

    <!-- ویرایش فازها -->
    <section class="section-card">
      <h2 class="font-bold mb-3">فازهای اجرایی</h2>
      <div id="phaseEditor"></div>
    </section>

    <!-- ویرایش تبصره‌ها -->
    <section class="section-card">
      <h2 class="font-bold mb-3">تبصره‌های تعدیل تورمی</h2>
      <div id="clauseEditor"></div>
    </section>

    <div class="flex gap-2">
      <button onclick="saveAll()" class="bg-blue-600 text-white px-6 py-2 rounded">ذخیره تغییرات</button>
      <button onclick="resetAll()" class="border px-6 py-2 rounded">بازگشت به حالت پیش‌فرض</button>
      <span id="saveMsg" class="text-green-600 self-center"></span>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
